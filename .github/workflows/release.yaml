name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP package
        run: |
          cd custom_components
          zip -r ../dietly.zip dietly

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dietly.zip
          generate_release_notes: true
