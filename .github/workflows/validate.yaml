name: Validate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  validate:
    name: Lint & HACS Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio aiohttp yarl

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Pyright
        run: |
          npx pyright custom_components/dietly

      - name: Run Pytest
        run: |
          pytest

      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          github_token: ${{ secrets.GITHUB_TOKEN }}
